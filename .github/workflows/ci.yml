name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      # uv.lock is committed, so CI is reproducible. Refresh it deliberately
      # with `uv lock --upgrade-package earthaccess` when the plugins branch
      # moves (the earthaccess pin is a branch, not a tag yet).
      - run: uv sync --locked --extra test --extra kerchunk
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
