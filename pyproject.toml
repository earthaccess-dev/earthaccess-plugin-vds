[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "earthaccess-plugin-vds"
version = "0.1.0"
description = "Virtual datasets for earthaccess: virtualize granules, create and append icechunk / kerchunk-parquet stores"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Luis López", email = "betolin@gmail.com" }]
dependencies = [
  # The contract lives on GitHub (not on PyPI yet).
  "earthaccess-plugin-spec @ git+https://github.com/earthaccess-dev/earthaccess-plugin-spec.git@v0.3.0",
  # TODO: switch to earthaccess>=1.0 (the release carrying the plugins work)
  # once the upstream `plugins` branch is merged and published.
  "earthaccess @ git+https://github.com/earthaccess-dev/earthaccess.git@plugins",
  "virtualizarr>=2.8",
  "h5py>=3.14.0",
  "obstore>=0.12",
  "icechunk>=2.3",
  "xarray",
  "dask",
]

[project.entry-points."earthaccess.plugins"]
vds = "earthaccess_vds:VDSPlugin"

[project.optional-dependencies]
kerchunk = ["kerchunk>=0.2.9", "pandas", "fastparquet>=2023.4.0", "fsspec", "s3fs"]
distributed = ["distributed", "dask-labextension>=7.0"]
test = ["pytest >=8.0", "mypy >=1.11", "ruff >=0.6"]

[project.urls]
Repository = "https://github.com/earthaccess-dev/earthaccess-plugin-vds"

# The contract lives on GitHub until it is published to PyPI. A direct URL in
# [project.dependencies] is honored by both pip and uv (pip ignores
# [tool.uv.sources]); hatchling requires opting in.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/earthaccess_vds"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
disallow_untyped_defs = true
pretty = true

[[tool.mypy.overrides]]
module = ["pytest", "pytest.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["kerchunk", "kerchunk.*", "fsspec", "fsspec.*", "fastparquet", "pandas", "s3fs", "tqdm", "tqdm.*", "distributed", "distributed.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
